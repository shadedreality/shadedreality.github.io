<style>
:root{
  --bg:#04070b;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.13);
  --txt:#e9f1f8;--mut:#93a6b8;--blue:#3aa0ff;--blue-d:#1d6fd0;--green:#25d98b;--green-d:#12a866;
  --red:#ff4d5e;--red-d:#d0283a;--yellow:#f5c542;--teal:#2fc9c2;--pop:#243447;--pop2:#31465d;
  --ac:var(--teal);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);color-scheme:dark;
  font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px}
body{min-height:100vh;background:
  radial-gradient(900px 520px at 8% -8%,rgba(58,160,255,.20),transparent 60%),
  radial-gradient(820px 520px at 100% 0%,rgba(37,217,139,.15),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.glass{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.glow-blue{color:#cfe6ff;text-shadow:0 0 14px rgba(58,160,255,.85),0 0 34px rgba(58,160,255,.45)}
.glow-green{color:#d2ffea;text-shadow:0 0 14px rgba(37,217,139,.85),0 0 34px rgba(37,217,139,.45)}
.glow-teal{color:#d5fffc;text-shadow:0 0 14px rgba(47,201,194,.85),0 0 34px rgba(47,201,194,.45)}
.glow-mix{color:#e6fbff;text-shadow:-6px 0 22px rgba(58,160,255,.75),6px 0 22px rgba(37,217,139,.75)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.2px}
.mut{color:var(--mut)}
/* buttons */
.btn{border:1px solid transparent;border-radius:11px;padding:9px 16px;cursor:pointer;font-weight:600;transition:filter .15s,transform .05s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tog:focus-visible,.pick:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.blue{background:linear-gradient(180deg,var(--blue),var(--blue-d));box-shadow:0 0 18px rgba(58,160,255,.35)}
.btn.green{background:linear-gradient(180deg,var(--green),var(--green-d));color:#03170d;box-shadow:0 0 18px rgba(37,217,139,.35)}
.btn.red{background:linear-gradient(180deg,var(--red),var(--red-d));box-shadow:0 0 18px rgba(255,77,94,.3)}
.btn.ghost{background:var(--panel);border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none;box-shadow:none}
.btn svg,.ic svg{width:18px;height:18px;flex:none}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{background:var(--panel2)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.danger{color:#ff8d98}.iconbtn.danger:hover{background:rgba(255,77,94,.2)}
/* fields */
input,select,textarea{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,160,255,.22)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9fc6ee 50%),linear-gradient(135deg,#9fc6ee 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select option{background:#1b2735;color:#e9f1f8}
input[type=number]{-moz-appearance:textfield}
input.bad{border-color:var(--red);background:rgba(255,77,94,.18);box-shadow:0 0 0 3px rgba(255,77,94,.2)}
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
/* picker */
.pick{display:inline-flex;align-items:center;gap:9px;background:var(--pop);border:1px solid #4f6d8e;color:#eaf4ff;border-radius:11px;padding:9px 14px;cursor:pointer;font-weight:600;min-width:150px}
.pick:hover{background:var(--pop2)}
.pick svg{width:17px;height:17px;color:#7fbcff;flex:none}
.pick.locked{cursor:default;opacity:.85;background:#2a3542;border-color:#55667a}.pick.locked:hover{background:#2a3542}
.pick.sm{padding:6px 9px;min-width:0;font-size:13px;font-weight:500}
.pop{position:fixed;z-index:1000;width:300px;background:var(--pop);border:1px solid #5b7a9c;border-radius:14px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 1px rgba(58,160,255,.25)}

.pop .dow{font-size:11px;text-align:center;color:#8fb3d9;padding:4px 0}
.pop .cell{background:#2c3f54;border:1px solid transparent;color:#e6f1fc;border-radius:8px;padding:8px 0;text-align:center;cursor:pointer;font-size:13px}
.pop .cell:hover{background:#3d5772}
.pop .cell.sel{background:var(--blue);color:#02121f;font-weight:700;box-shadow:0 0 12px rgba(58,160,255,.6)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto}
.modal{width:100%;max-width:460px;padding:24px;background:rgba(14,22,32,.88)}
.modal.wide{max-width:900px}
.modal h3{font-size:20px;margin-bottom:16px}
.modal p{color:#c6d4e0;line-height:1.5;margin:0 0 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.row.sp{justify-content:space-between}
#loader{position:fixed;inset:0;z-index:2000;background:rgba(2,6,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#loader.on{display:flex}
.spin{width:58px;height:58px;border-radius:50%;border:5px solid rgba(255,255,255,.12);border-top-color:var(--blue);border-right-color:var(--green);animation:sp .9s linear infinite;box-shadow:0 0 24px rgba(58,160,255,.35)}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:rgba(16,28,40,.95);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.tst.ok{border-color:var(--green)}.tst.err{border-color:var(--red)}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:400px;padding:34px 30px}
.login h1{font-size:44px;text-align:center;margin-bottom:6px}
.login .sub{text-align:center;color:var(--mut);margin-bottom:26px}
.err{color:#ff8d98;font-size:14px;min-height:20px;margin:-4px 0 10px}
/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:34px}
.top h1{font-size:40px}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.block{padding:30px 26px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:18px;color:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
.block:hover{transform:translateY(-3px)}
.block .big{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.block .big{width:76px;height:76px}.block .big img{width:54px;height:54px;display:block}
.block h2{font-size:24px}
.block.emp{--c:var(--teal)}.block.att{--c:var(--blue)}.block.sal{--c:var(--green)}
.block .big{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);box-shadow:0 0 26px color-mix(in srgb,var(--c) 40%,transparent)}
.block:hover{border-color:var(--c);box-shadow:0 0 34px color-mix(in srgb,var(--c) 30%,transparent)}
.block h2{color:var(--c);text-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}
.block p{margin:0;color:var(--mut)}
/* sub page */
.att-p{--ac:var(--blue)}.sal-p{--ac:var(--green)}.emp-p{--ac:var(--teal)}
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.hdr .big{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 40%,transparent)}
.hdr .big{width:58px;height:58px}.hdr .big img{width:42px;height:42px;display:block}
.hdr h1{font-size:30px;color:var(--ac);text-shadow:0 0 16px color-mix(in srgb,var(--ac) 80%,transparent),0 0 36px color-mix(in srgb,var(--ac) 40%,transparent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--panel);border:1px solid var(--line);color:#c9d8e6;border-radius:11px;padding:9px 18px;cursor:pointer;font-weight:600}
.tab:hover{background:var(--panel2)}
.tab.on{background:color-mix(in srgb,var(--ac) 24%,transparent);border-color:var(--ac);color:#fff;box-shadow:0 0 16px color-mix(in srgb,var(--ac) 35%,transparent)}
.tabs.sub .tab{padding:6px 14px;font-size:14px;border-radius:9px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar .grow{flex:1}
.panel{padding:14px}
/* rows */
.lst{display:flex;flex-direction:column;gap:9px}
.lh{display:grid;gap:10px;padding:0 16px;color:var(--mut);font-size:13px}
.erow,.arow{display:grid;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.erow,.lh.e{grid-template-columns:2.2fr 1.1fr 1.1fr 1.4fr 48px}
.erow.left{background:rgba(255,77,94,.20);border-color:rgba(255,77,94,.6)}
.ident b{display:block;font-weight:600}
.ident span{font-size:12px;color:var(--mut);letter-spacing:.4px}
.tog{border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:13px;width:max-content;color:#04110a}
.tog.yel{background:var(--yellow);box-shadow:0 0 12px rgba(245,197,66,.4)}
.tog.blu{background:var(--blue);color:#02121f;box-shadow:0 0 12px rgba(58,160,255,.45)}
.tog.grn{background:var(--green);box-shadow:0 0 12px rgba(37,217,139,.4)}
.tog.red{background:var(--red);color:#fff;box-shadow:0 0 12px rgba(255,77,94,.4)}
.info{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--teal);background:transparent;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer;font-family:Georgia,serif;font-style:italic;margin-left:8px;line-height:1}
.info:hover{background:rgba(47,201,194,.22)}
.empty{padding:34px;text-align:center;color:var(--mut)}

.arow{grid-template-columns:minmax(150px,1.2fr) 2fr}
.marks{display:flex;gap:8px;flex-wrap:wrap}
.mk{border:1.5px solid;background:transparent;border-radius:10px;padding:7px 16px;min-width:56px;cursor:pointer;font-weight:700}
.mk.g{border-color:var(--green);color:var(--green)}.mk.g.on{background:var(--green);color:#03170d;box-shadow:0 0 14px rgba(37,217,139,.5)}
.mk.y{border-color:var(--yellow);color:var(--yellow)}.mk.y.on{background:var(--yellow);color:#211a02;box-shadow:0 0 14px rgba(245,197,66,.5)}
.mk.r{border-color:var(--red);color:var(--red)}.mk.r.on{background:var(--red);color:#fff;box-shadow:0 0 14px rgba(255,77,94,.5)}
.pl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pl label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.pl input{width:96px}
.cur{font-size:12px;color:var(--mut)}
.yr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.yr input{padding:7px 6px;text-align:center;font-size:13px}
.arow.y{grid-template-columns:minmax(150px,.9fr) 3fr}
.chip{display:inline-block;border-radius:8px;padding:4px 12px;font-weight:700;border:1.5px solid}
.chip.g{color:var(--green);border-color:var(--green)}.chip.y{color:var(--yellow);border-color:var(--yellow)}.chip.r{color:var(--red);border-color:var(--red)}.chip.n{color:var(--mut);border-color:var(--line)}
.status-err{background:rgba(255,77,94,.16);border:1px solid var(--red);color:#ffb3bb;border-radius:11px;padding:9px 13px;margin-bottom:14px}
.submitbar{position:sticky;bottom:0;display:flex;justify-content:flex-end;padding:14px 0 0;margin-top:14px}

.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.xb{overflow:hidden}
.xb .xh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--green) 16%,transparent);border-bottom:1px solid var(--line)}
.xb table{width:100%;border-collapse:collapse}
.xb th{font-size:12px;color:var(--mut);text-align:left;padding:8px 8px 4px;font-weight:500}
.xb td{padding:4px 5px}
.xb .xt{padding:8px 12px;font-size:13px;color:var(--mut);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.xb input,.xb select{padding:6px 8px;font-size:13px}
.xb td:last-child{width:34px}
.xx{background:none;border:none;color:#ff8d98;cursor:pointer;font-size:18px;line-height:1;padding:4px}
/* calc table */
.scroll{overflow-x:auto}
.calc{width:100%;min-width:880px;border-collapse:separate;border-spacing:0 6px;table-layout:fixed;font-size:12.5px}
.calc th{font-size:11.5px;font-weight:500;color:var(--mut);text-align:right;padding:4px 5px;vertical-align:bottom}
.calc th:first-child,.calc td:first-child{text-align:left}
.calc td{background:var(--panel);padding:8px 5px;text-align:right;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.calc td:first-child{border-left:1px solid var(--line);border-radius:11px 0 0 11px;padding-left:10px}
.calc td:last-child{border-right:1px solid var(--line);border-radius:0 11px 11px 0;text-align:center}
.calc input{padding:5px 6px;font-size:12.5px;text-align:right}
.calc .mi{display:flex;gap:3px;align-items:center}
.calc .mi .iconbtn{width:26px;height:26px;flex:none;border-radius:8px}
.calc .mi .iconbtn svg{width:13px;height:13px}
.calc .mi .iconbtn.has{border-color:var(--green);color:var(--green)}
.ns{font-weight:700}.ns.pos{color:var(--green);text-shadow:0 0 10px rgba(37,217,139,.5)}.ns.neg{color:var(--red);text-shadow:0 0 10px rgba(255,77,94,.5)}
.dn{width:100%;border-collapse:separate;border-spacing:0 6px}
.dn th{font-size:13px;color:var(--mut);padding:4px 10px;text-align:right}
.dn th:first-child,.dn td:first-child{text-align:left}
.dn td{background:var(--panel);padding:10px;text-align:right;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.dn td:first-child{border-left:1px solid var(--line);border-radius:11px 0 0 11px}
.dn td:last-child{border-right:1px solid var(--line);border-radius:0 11px 11px 0}
.dn tr.tot td{background:color-mix(in srgb,var(--green) 14%,transparent);font-weight:700}
.dn .h500{color:var(--green)}
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.slip{padding:16px}
.slip .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:8px}
.slip .ln{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.slip .ln span:first-child{color:#b9cad9}
.slip .ln.net{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:16px}
.slip table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.slip th{color:var(--mut);text-align:left;font-weight:500;padding:3px 0}
.slip td{padding:3px 0}
.slip td:nth-child(2),.slip th:nth-child(2){text-align:right}
.slip td:nth-child(3),.slip th:nth-child(3){text-align:right}
.note{color:var(--mut);font-size:13px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--mut);font-size:13px;font-weight:500;padding:6px 6px}
.tbl td{padding:5px 6px;vertical-align:middle}
.tbl input,.tbl select{padding:7px 9px;font-size:14px}
.foot{margin-top:40px;text-align:center;color:var(--mut);font-size:12px}
@media (max-width:720px){
  .erow,.lh.e{grid-template-columns:1.6fr 1fr 44px;row-gap:8px}

  .lh.e{display:none}
  .arow,.arow.y{grid-template-columns:1fr}
  .top h1{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- storage: shared db when available, else this browser ---------- */
const Store={
  cache:{},db:null,mode:'local',
  async init(){
    try{
      if(window.claude&&typeof window.claude.use==='function'){
        const db=await Promise.race([window.claude.use('db'),delay(4000).then(()=>null)]);
        if(db){
          const snap=await db.collection('kv').get();
          snap.docs.forEach(d=>{const x=d.data();if(x&&typeof x.v==='string'){try{this.cache[d.id]=JSON.parse(x.v)}catch(e){}}});
          this.db=db;this.mode='cloud';return;
        }
      }
    }catch(e){console.warn('db unavailable',e)}
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('tp:')===0){try{this.cache[k.slice(3)]=JSON.parse(localStorage.getItem(k))}catch(e){}}}}catch(e){}
  },
  get(k,def){return k in this.cache?this.cache[k]:def},
  async persist(k,v){
    if(this.db)await this.db.doc('kv/'+k).set({v:JSON.stringify(v)});
    else localStorage.setItem('tp:'+k,JSON.stringify(v));
  },
  tx(){
    const self=this,pend={};
    const cl=v=>v===undefined?v:JSON.parse(JSON.stringify(v));
    return{
      get(k,def){return cl(k in pend?pend[k]:(k in self.cache?self.cache[k]:def))},
      set(k,v){pend[k]=cl(v)},
      async commit(){
        const keys=Object.keys(pend);
        await Promise.all(keys.map(k=>self.persist(k,pend[k])));
        keys.forEach(k=>{self.cache[k]=pend[k]});
      }
    };
  }
};

const VAL={'P':1,'P/L':.5,'L/P':.5,'L':0};
const MARKS=[['P','g'],['P/L','y'],['L/P','y'],['L','r']];
const cls=s=>({'P':'g','P/L':'y','L/P':'y','L':'r'}[s]||'n');
const emps=(R)=>(R||Store).get('employees',[]).slice().sort((a,b)=>Number(a.id)-Number(b.id));
const working=()=>emps().filter(e=>e.status==='W');
const empById=id=>emps().find(e=>e.id===id);

function effBS(R,nid,ym){
  const list=R.get('salary_history',[]).filter(x=>x.nid===nid&&fromMy(x.eff)<=ym);
  list.sort((a,b)=>fromMy(b.eff).localeCompare(fromMy(a.eff))||b.createdAt-a.createdAt);
  return list.length?list[0].bs:null;
}
function effList(nid){
  const by={};
  Store.get('salary_history',[]).filter(x=>x.nid===nid).forEach(x=>{const k=fromMy(x.eff);if(!by[k]||by[k].createdAt<=x.createdAt)by[k]=x});
  const ks=Object.keys(by).sort();
  return ks.map((k,i)=>({from:k,to:i+1<ks.length?shiftYM(ks[i+1],-1):null,bs:by[k].bs}));
}
function pdInfo(R,nid,ym){
  const a=R.get('att_'+my(ym),{})[nid];
  if(a&&a.manual)return{pd:a.pd,manual:true};
  const dd=R.get('daily_'+ym,{})[nid];
  if(dd&&Object.keys(dd).length)return{pd:Object.values(dd).reduce((s,x)=>s+x.v,0),manual:false};
  return null;
}
function sumExp(nid,ym){
  const rows=(Store.get('exp_'+my(ym),{})[nid])||[];
  let ac=0,pb=0;rows.forEach(r=>{const a=num(r.a);if(r.c==='BILL')pb+=a;else ac+=a});
  return{ac,pb,rows};
}
const sha=async(u,p)=>{
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u.toLowerCase()+':'+p));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
};

async function seed(){
  if(Store.get('meta_seeded'))return;
  const tx=Store.tx();
  if(!tx.get('users')){
    tx.set('users',[
      {u:'master',h:await sha('master','master123'),l:2},
      {u:'001',h:await sha('001','001'),l:1},
      {u:'002',h:await sha('002','002'),l:1}
    ]);
  }
  if(!tx.get('employees')){
    const p=prevYM(),y0=shiftYM(p,-8),y1=shiftYM(p,-3);
    const sample=[
      ['Aarav Sharma','C','W','Sunday',y0,26000],['Priya Verma','T','W','Saturday',y0,32500],
      ['Rohit Kumar','C','W','N/A',y0,18000],['Sunita Devi','C','W','Wednesday',y1,15500],
      ['Mohammed Irfan','T','W','Friday',y1,41000],['Anjali Singh','C','L','Sunday',y0,22000]
    ];
    const emp=[],hist=[];let next=100001;const now=Date.now();
    sample.forEach((s,i)=>{const id=String(next++);emp.push({id,name:s[0],pay:s[1],status:s[2],wd:s[3],join:my(s[4])});hist.push({id:'sh_'+id,nid:id,eff:my(s[4]),bs:s[5],createdAt:now+i})});
    tx.set('employees',emp);tx.set('salary_history',hist);tx.set('meta_nextid',next);
  }
  tx.set('meta_seeded',true);
  await tx.commit();
}

async function addEmployees(rows){
  const tx=Store.tx();let next=tx.get('meta_nextid',100001);
  const list=tx.get('employees',[]),hist=tx.get('salary_history',[]);const now=Date.now();
  rows.forEach((r,i)=>{
    const id=String(next++);
    list.push({id,name:r.name.trim(),pay:r.pay,status:r.status,wd:r.wd,join:my(r.join)});
    hist.push({id:'sh_'+id+'_'+now,nid:id,eff:my(r.join),bs:Number(r.bs),createdAt:now+i});
  });
  tx.set('employees',list);tx.set('salary_history',hist);tx.set('meta_nextid',next);

function toast(msg,kind){

}
async function withLoader(label,fn){
  $('#loaderTxt').textContent=label||'Recording…';$('#loader').classList.add('on');
  try{const r=await Promise.all([fn(),delay(450)]);return r[0]}
  catch(e){console.error(e);toast('Could not save: '+(e&&e.message?e.message:'storage error'),'err');return false}
  finally{$('#loader').classList.remove('on')}
}
function modal(html,opts){
  opts=opts||{};
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal glass ${opts.wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  ov.close=()=>{closePop();ov.remove()};
  ov.addEventListener('mousedown',e=>{if(e.target===ov&&!opts.lock)ov.close()});
  return ov;
}
function confirmDlg(msg,o){

function pickBtn(name,kind,value,o){
  o=o||{};
  const extra=Object.keys(o.data||{}).map(k=>` data-${k}="${esc(o.data[k])}"`).join('');
  if(o.locked)return `<div class="pick locked" title="Only authority 2 can change the date">${ICON.calp}<span class="pv">${esc(fmtPick(kind,value,o.fmt))}</span></div>`;
  return `<button type="button" class="pick ${o.cls||''}" data-pick="${kind}" data-name="${name}" data-value="${esc(value)}" data-fmt="${o.fmt||''}"${extra}>${ICON.calp}<span class="pv">${esc(fmtPick(kind,value,o.fmt))}</span></button>`;

let popEl=null;
function closePop(){if(popEl){popEl.remove();popEl=null}}
function openPicker(btn){
  closePop();
  const kind=btn.dataset.pick,val=btn.dataset.value,fmt=btn.dataset.fmt;
  const pop=document.createElement('div');pop.className='pop';popEl=pop;document.body.appendChild(pop);
  let st;
  if(kind==='date'){const p=val.split('-').map(Number);st={y:p[0],m:p[1]}}
  else if(kind==='month')st={y:+val.split('-')[0]};
  else st={b:+val};
  const draw=()=>{
    if(kind==='date'){
      const first=new Date(st.y,st.m-1,1).getDay(),dim=daysIn(st.y,st.m),tdy=ymdOf(new Date());
      let c='';for(let i=0;i<first;i++)c+='<span class="cell e"></span>';
      for(let d=1;d<=dim;d++){const v=`${st.y}-${pad(st.m)}-${pad(d)}`;c+=`<button type="button" class="cell ${v===val?'sel':''} ${v===tdy?'today':''}" data-v="${v}">${d}</button>`}
      pop.innerHTML=`<div class="ph"><button type="button" class="nav" data-n="-12">«</button><button type="button" class="nav" data-n="-1">‹</button><b>${MONTHS[st.m-1]} ${st.y}</b><button type="button" class="nav" data-n="1">›</button><button type="button" class="nav" data-n="12">»</button></div><div class="g7">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>`<span class="dow">${x}</span>`).join('')}${c}</div>`;
    }else if(kind==='month'){
      let c='';for(let m=1;m<=12;m++){const v=`${st.y}-${pad(m)}`;c+=`<button type="button" class="cell ${v===val?'sel':''} ${v===curYM()?'today':''}" data-v="${v}">${M3[m-1]}</button>`}
      pop.innerHTML=`<div class="ph"><button type="button" class="nav" data-n="-1">‹</button><b>${st.y}</b><button type="button" class="nav" data-n="1">›</button></div><div class="g3">${c}</div>`;
    }else{
      let c='';for(let y=st.b-5;y<=st.b+6;y++){c+=`<button type="button" class="cell ${String(y)===String(val)?'sel':''} ${y===new Date().getFullYear()?'today':''}" data-v="${y}">${y}</button>`}
      pop.innerHTML=`<div class="ph"><button type="button" class="nav" data-n="-12">‹</button><b>${st.b-5} – ${st.b+6}</b><button type="button" class="nav" data-n="12">›</button></div><div class="g3">${c}</div>`;
    }
  };
  draw();
  pop.addEventListener('click',e=>{
    const n=e.target.closest('[data-n]');
    if(n){
      const d=+n.dataset.n;
      if(kind==='date'){let t=st.m+d,y=st.y;while(t<1){t+=12;y--}while(t>12){t-=12;y++}st.m=t;st.y=y}
      else if(kind==='month')st.y+=d;else st.b+=d;
      draw();return;
    }
    const c=e.target.closest('[data-v]');
    if(c){
      const v=c.dataset.v;btn.dataset.value=v;const pv=$('.pv',btn);if(pv)pv.textContent=fmtPick(kind,v,fmt);
      closePop();const h=onPick[btn.dataset.name];if(h)h(v,btn);
    }
  });
  const r=btn.getBoundingClientRect(),w=300;
  let left=Math.min(Math.max(8,r.left),window.innerWidth-w-8),top=r.bottom+6;
  if(top+340>window.innerHeight)top=Math.max(8,r.top-346);
  pop.style.left=left+'px';pop.style.top=top+'px';
}

function mmValidate(){
  const a=S.att,[y,m]=a.ym.split('-').map(Number),DM=daysIn(y,m);
  const bad=Object.values(a.mm).find(x=>x.bad);
  $('#mmErr').innerHTML=bad?`<div class="status-err">${esc(bad.msg)}</div>`:'';

}
function onMonthlyInput(el){
  const a=S.att,[y,m]=a.ym.split('-').map(Number),DM=daysIn(y,m);
  const id=el.dataset.id,f=el.dataset.f,row=el.closest('.arow');
  const pdI=$('[data-f=pd]',row),ldI=$('[data-f=ld]',row),other=f==='pd'?ldI:pdI;
  pdI.classList.remove('bad');ldI.classList.remove('bad');
  const v=el.value.trim();
  if(v===''){other.value='';delete a.mm[id];mmValidate();return}
  const n=parseFloat(v);
  if(isNaN(n)||n<0||Math.round(n*2)!==n*2){el.classList.add('bad');other.value='';a.mm[id]={bad:true,msg:'Enter a number from 0 to '+DM+' in steps of 0.5.'};mmValidate();return}
  if(n>DM){el.classList.add('bad');other.value='';a.mm[id]={bad:true,msg:'No. of present/ absent cannot be greater than number of days in a month'};mmValidate();return}
  other.value=fmtN(DM-n);
  a.mm[id]={pd:f==='pd'?n:DM-n};mmValidate();
}
function onYearlyInput(el){
  const a=S.att,id=el.dataset.id,mo=+el.dataset.m,DM=daysIn(a.year,mo),key=id+'_'+mo;
  el.classList.remove('bad');
  const v=el.value.trim();
  if(v===''){delete a.yy[key]}
  else{
    const n=parseFloat(v);
    if(isNaN(n)||n<0||Math.round(n*2)!==n*2)a.yy[key]={bad:true,msg:'Enter a number from 0 to '+DM+' in steps of 0.5 ('+M3[mo-1]+').'};
    else if(n>DM)a.yy[key]={bad:true,msg:'No. of present/ absent cannot be greater than number of days in a month ('+M3[mo-1]+' has '+DM+').'};
    else a.yy[key]={id,mo,pd:n};
    if(a.yy[key].bad)el.classList.add('bad');
  }
  const bad=Object.values(a.yy).find(x=>x.bad);
  $('#yyErr').innerHTML=bad?`<div class="status-err">${esc(bad.msg)}</div>`:'';
  $('#yySubmit').disabled=!!bad;
}

const r10=n=>Math.round(n/10)*10;
function initCalc(){
  const ym=S.sal.ym;
  if(S.calc&&S.calc.ym===ym)return;
  const mw=Store.get('mw_'+my(ym),{}),[y,m]=ym.split('-').map(Number),DM=daysIn(y,m),rows={};
  working().forEach(e=>{
    const s=mw[e.id]||{},pi=pdInfo(Store,e.id,ym),ex=sumExp(e.id,ym);
    rows[e.id]={bs:effBS(Store,e.id,ym)||0,pd:pi?pi.pd:0,hasPd:!!pi,ac:ex.ac,pb:ex.pb,
      wo:s.wo!=null?String(s.wo):'',m1:s.m1?String(s.m1):'',m1c:s.m1c||'',m2:s.m2?String(s.m2):'',m2c:s.m2c||'',pay:e.pay};
  });
  S.calc={ym,DM,rows};
}
function calcVals(r){
  const wo=num(r.wo),gs=(r.bs/S.calc.DM)*(r.pd+wo),ns=r10(gs-r.ac-r.pb-num(r.m1)+num(r.m2));
  return{gs:Math.round(gs*100)/100,ns};
}

function denoms(ns){
  const out=[];let rem=Math.max(0,Math.round(ns));
  [500,200,100,50,20,10].forEach(d=>{out.push(Math.floor(rem/d));rem%=d});
  return out;
}
function tabCash(){
  const ym=S.sal.ym,mw=Store.get('mw_'+my(ym),{}),ws=working().filter(e=>e.pay==='C');
  const tot=[0,0,0,0,0,0];let missing=0;
  const rows=ws.map(e=>{
    const s=mw[e.id];
    if(!s||s.net==null){missing++;return `<tr><td>${ident(e)}</td><td class="mut">Not saved</td><td colspan="6"></td></tr>`}
    const d=denoms(s.net);d.forEach((n,i)=>tot[i]+=n);
    return `<tr><td>${ident(e)}</td><td class="ns ${s.net<0?'neg':'pos'}">${inr(s.net)}</td>${d.map((n,i)=>`<td class="${i===0?'h500':''}">${n?n:''}</td>`).join('')}</tr>`;
  }).join('');
  return `<p class="note" style="margin-top:0">Cash employees who are Working, using the net salary saved for ${ymLabel(ym)}.${missing?` <b style="color:var(--yellow)">${missing} not saved yet — save salary first.</b>`:''}</p>
    <div class="scroll"><table class="dn"><thead><tr><th>Employee</th><th>Net Salary</th><th>500</th><th>200</th><th>100</th><th>50</th><th>20</th><th>10</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No Working employees paid in cash.</td></tr>'}
    ${ws.length?`<tr class="tot"><td>Total notes</td><td></td>${tot.map(n=>`<td>${n||''}</td>`).join('')}</tr>`:''}</tbody></table></div>`;
}

function slipData(nid,ym){
  const s=Store.get('mw_'+my(ym),{})[nid];
  if(!s||s.net==null)return null;
  return{s,rows:(Store.get('exp_'+my(ym),{})[nid])||[]};
}
function tabSlips(){
  const ym=S.sal.ym,ws=working(),have=[],miss=[];
  ws.forEach(e=>{const d=slipData(e.id,ym);d?have.push([e,d]):miss.push(e)});
  const blocks=have.map(([e,d])=>{
    const s=d.s;
    const ln=(l,v,c)=>`<div class="ln"><span>${l}</span><span>${v}</span></div>`;
    return `<div class="slip glass"><div class="sh"><b>${esc(e.name)}</b><span class="mut">ID ${e.id}</span></div>
      ${ln('Base Salary (BS)',inr(s.base))}${ln('No. of Present (PD)',fmtN(s.attendance||0))}${ln('No. of Weekoffs (WO)',fmtN(s.wo||0))}${ln('Gross Salary (GS)',inr(s.gross))}
      ${ln('Advance (−)',inr(s.ac))}${ln('Pending Bills (−)',inr(s.pb))}
      ${ln('Misc-1 (−)'+(s.m1c?' ('+esc(s.m1c)+')':''),inr(s.m1))}${ln('Misc-2 (+)'+(s.m2c?' ('+esc(s.m2c)+')':''),inr(s.m2))}
      <div class="ln net"><span>Net Salary (NS)</span><span class="${s.net<0?'ns neg':'ns pos'}">${inr(s.net)}</span></div>
      <table><thead><tr><th>Date</th><th>Amount</th><th>Category</th></tr></thead><tbody>${d.rows.length?d.rows.map(r=>`<tr><td>${dmy(r.d)}</td><td>${inr(r.a)}</td><td>${r.c}</td></tr>`).join(''):'<tr><td colspan="3" class="mut">No expenses recorded</td></tr>'}</tbody></table></div>`;
  }).join('');
  return `<div class="bar"><span class="mut grow">${have.length} payslip${have.length===1?'':'s'} for ${ymLabel(ym)}${miss.length?` · <span style="color:var(--yellow)">${miss.length} waiting for saved salary</span>`:''}</span>
    <button class="btn green" data-act="pdf" ${have.length?'':'disabled'}>${ICON.pdf}Download all as PDF</button></div>
    <div class="slips">${blocks||'<div class="empty glass" style="grid-column:1/-1">No payslips yet. Save salary in the Salary Calculation tab first.</div>'}</div>`;
}

/* ---------- payslip PDF (A4, packed to save paper) ---------- */
function buildPdf(ym){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'a4'});
  const PW=595.28,PH=841.89,M=24,GAP=10,colW=(PW-2*M-GAP)/2,top=M+22,maxH=PH-M-top,lh=10.5,pad0=8;
  const R=n=>'Rs. '+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
  const items=[];
  working().forEach(e=>{
    const d=slipData(e.id,ym);if(!d)return;const s=d.s;doc.setFontSize(8);doc.setFont('helvetica','normal');
    const L=[['Base Salary (BS)',R(s.base)],['No. of Present (PD)',fmtN(s.attendance||0)],['No. of Weekoffs (WO)',fmtN(s.wo||0)],['Gross Salary (GS)',R(s.gross)],['Advance (-)',R(s.ac)],['Pending Bills (-)',R(s.pb)],
      ['Misc-1 (-)'+(s.m1c?' ('+s.m1c+')':''),R(s.m1)],['Misc-2 (+)'+(s.m2c?' ('+s.m2c+')':''),R(s.m2)]];
    const lines=L.map(x=>({v:x[1],t:doc.splitTextToSize(x[0],colW-2*pad0-70)}));
    let h=pad0+13+4;lines.forEach(l=>h+=l.t.length*lh);h+=lh+6;         // net row
    h+=lh+3+Math.max(1,d.rows.length)*lh+pad0;
    items.push({e,s,rows:d.rows,lines,h});
  });
  if(!items.length)return null;
  items.sort((a,b)=>b.h-a.h);
  const bins=[];
  items.forEach(it=>{
    let b=bins.find(x=>x.used+it.h+(x.n?GAP:0)<=maxH);
    if(!b){const pg=Math.floor(bins.length/2);b={pg,col:bins.length%2,used:0,n:0,list:[]};bins.push(b)}
    b.used+=it.h+(b.n?GAP:0);b.n++;b.list.push(it);
  });
  const pages=Math.ceil(bins.length/2);
  for(let p=0;p<pages;p++){
    if(p>0)doc.addPage();
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('TimePay - Payslips',M,M+8);
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(`${MONTHS[+ym.split('-')[1]-1]} ${ym.split('-')[0]}`,PW/2,M+8,{align:'center'});doc.text(`Page ${p+1} of ${pages}`,PW-M,M+8,{align:'right'});
    doc.setDrawColor(160);doc.line(M,M+13,PW-M,M+13);
  }
  bins.forEach(b=>{
    doc.setPage(b.pg+1);
    let y=top;const x=M+b.col*(colW+GAP);
    b.list.forEach(it=>{
      doc.setDrawColor(120);doc.setLineWidth(.6);doc.roundedRect(x,y,colW,it.h,3,3);
      let cy=y+pad0+8;
      doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text(it.e.name,x+pad0,cy);doc.setFontSize(8);doc.text('ID '+it.e.id,x+colW-pad0,cy,{align:'right'});
      cy+=4;doc.setDrawColor(190);doc.line(x+pad0,cy,x+colW-pad0,cy);cy+=lh;
      doc.setFont('helvetica','normal');doc.setFontSize(8);
      it.lines.forEach(l=>{doc.text(l.t,x+pad0,cy);doc.text(l.v,x+colW-pad0,cy,{align:'right'});cy+=l.t.length*lh});
      cy+=2;doc.setDrawColor(120);doc.line(x+pad0,cy-lh+3,x+colW-pad0,cy-lh+3);
      doc.setFont('helvetica','bold');doc.text('Net Salary (NS)',x+pad0,cy+2);doc.text(R(it.s.net),x+colW-pad0,cy+2,{align:'right'});cy+=lh+4;
      doc.setFontSize(7.5);doc.setTextColor(90);doc.text('Date',x+pad0,cy);doc.text('Amount',x+colW*0.58,cy,{align:'right'});doc.text('Category',x+colW-pad0,cy,{align:'right'});doc.setTextColor(0);cy+=lh;
      doc.setFont('helvetica','normal');
      if(!it.rows.length){doc.setTextColor(110);doc.text('No expenses recorded',x+pad0,cy);doc.setTextColor(0)}
      it.rows.forEach(r=>{doc.text(dmy(r.d),x+pad0,cy);doc.text(R(r.a),x+colW*0.58,cy,{align:'right'});doc.text(r.c,x+colW-pad0,cy,{align:'right'});cy+=lh});
      y+=it.h+GAP;
    });
  });
  return doc.output('arraybuffer');
}
async function downloadPdf(){
  const ym=S.sal.ym;
  if(!window.jspdf){toast('The PDF library could not be loaded.','err');return}
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){toast('Downloads are not available in this view.','err');return}
  const buf=buildPdf(ym);
  if(!buf){toast('No payslips to export.','err');return}
  try{await dl.save({filename:`TimePay_Payslips_${my(ym)}.pdf`,data:buf});toast('PDF ready.','ok')}
  catch(e){if(!e||e.code!=='declined')toast('Could not save the PDF.','err')}
}

/* ---------- events ---------- */
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm')return;
  e.preventDefault();
  const u=$('#lu').value.trim(),p=$('#lp').value,err=$('#lerr');
  const h=await sha(u,p),rec=Store.get('users',[]).find(x=>x.u.toLowerCase()===u.toLowerCase()&&x.h===h);
  if(!rec){err.textContent='Incorrect username or password.';return}
  S.user={u:rec.u,l:rec.l};try{sessionStorage.setItem('tp_user',rec.u)}catch(x){}
  S.page='home';render();
});

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id,nid=b.dataset.nid;
  switch(act){
    case 'mclose':{const ov=b.closest('.ov');if(ov)ov.close();break}
    case 'home':go('home');break;
    case 'goemployees':go('employees');break;
    case 'goattendance':go('attendance');break;
    case 'gosalary':go('salary');break;
    case 'logout':if(await guard()){S.user=null;S.exp=null;S.calc=null;S.page='login';try{sessionStorage.removeItem('tp_user')}catch(x){}render()}break;
    case 'adduser':if(S.user.l>=2)openAddUser();break;
    case 'manageusers':if(S.user.l>=2)openManageUsers();break;
    case 'addemp':openAddEmployee();break;
    case 'bulkemp':openBulk();break;
    case 'mtog':{
      const f=b.dataset.f,nv=f==='pay'?(b.dataset.v==='C'?'T':'C'):(b.dataset.v==='W'?'L':'W');
      const a=f==='pay'?togPay(nv):togSt(nv);b.dataset.v=nv;b.className='tog '+a[0];b.textContent=a[1];break}
    case 'brem':break;
    case 'togpay':case 'togst':{
      const ok=await withLoader('Updating…',async()=>{
        const tx=Store.tx(),l=tx.get('employees',[]),t=l.find(x=>x.id===id);
        if(act==='togpay')t.pay=t.pay==='C'?'T':'C';else t.status=t.status==='W'?'L':'W';
        tx.set('employees',l);await tx.commit();
      });
      if(ok!==false)render();break}
    case 'bsinfo':openBsHistory(id);break;
    case 'delemp':{
      const emp=empById(id);
      if(await confirmDlg(`Delete ${emp.name} (${id})? This removes the employee from the list. The ID ${id} will never be reused.`,{yes:'Delete',no:'Cancel',danger:true,title:'Delete employee'})){
        const ok=await withLoader('Deleting…',async()=>{
          const tx=Store.tx();tx.set('employees',tx.get('employees',[]).filter(x=>x.id!==id));
          tx.set('salary_history',tx.get('salary_history',[]).filter(x=>x.nid!==id));await tx.commit();
        });
        if(ok!==false){toast('Employee deleted.','ok');render()}
      }
      break}
    case 'tab':{
      const g=b.dataset.g,v=b.dataset.v;
      if(g==='atab'){S.att.tab=v;render()}
      else if(g==='asub'){S.att.sub=v;render()}
      else if(g==='stab'){if(!(await guard()))break;S.sal.tab=v;S.calc=null;render()}
      break}
    case 'mark':{
      S.att.marks[id]=b.dataset.v;
      $$(`.mk[data-id="${id}"]`).forEach(x=>x.classList.toggle('on',x.dataset.v===b.dataset.v));break}
    case 'submitdaily':submitDaily();break;
    case 'submitmonthly':submitMonthly();break;
    case 'submityearly':submitYearly();break;
    case 'xadd':S.exp.rows[nid].push({d:ymdOf(new Date()),a:'',c:'CASH'});S.exp.dirty=true;render();break;
    case 'xdel':{const rs=S.exp.rows[nid];rs.splice(+b.dataset.i,1);if(!rs.length)rs.push({d:ymdOf(new Date()),a:'',c:'CASH'});S.exp.dirty=true;render();break}
    case 'saveexp':if(await saveExpenses()){S.calc=null;render()}break;
    case 'savecalc':saveCalc();break;
    case 'cmt':openComment(nid,b.dataset.f);break;
    case 'pdf':downloadPdf();break;
  }
});
// remove row in bulk dialog (delegated separately because it lives inside modals)
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-pick]');if(b&&!b.classList.contains('locked'))openPicker(b);
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='mm')onMonthlyInput(t);
  else if(k==='yy')onYearlyInput(t);
  else if(k==='expamt'||k==='expcat'){
    const r=S.exp.rows[t.dataset.nid][+t.dataset.i];
    if(k==='expamt')r.a=t.value;else r.c=t.value;
    S.exp.dirty=true;expTotals(t.dataset.nid);
  }else if(k==='calc')onCalcInput(t);
});

onPick.adate=v=>{S.att.date=v;loadMarks();render()};
onPick.amonth=v=>{S.att.ym=v;S.att.mm={};render()};
onPick.ayear=v=>{S.att.year=+v;S.att.yy={};render()};
onPick.rdate=v=>{S.att.rdate=v;render()};
onPick.rmonth=v=>{S.att.rym=v;render()};
onPick.ryear=v=>{S.att.ryear=+v;render()};
onPick.smonth=async v=>{
  const prev=S.sal.ym;
  if(v===prev)return;
  if(S.exp&&S.exp.dirty){
    const yes=await confirmDlg('You have unsaved changes. Save them?',{yes:'YES',no:'NO',title:'Unsaved expenses'});
    if(yes){if(!(await saveExpenses())){render();return}}
  }
  S.sal.ym=v;S.exp=null;S.calc=null;render();
};
onPick.expdate=(v,btn)=>{S.exp.rows[btn.dataset.nid][+btn.dataset.i].d=v;S.exp.dirty=true};

/* ---------- boot ---------- */
(async function boot(){
  app.innerHTML='<div class="login"><div class="spin"></div></div>';
  await Store.init();
  try{await seed()}catch(e){console.error(e);toast('Could not prepare starter data.','err')}
  try{
    const u=sessionStorage.getItem('tp_user');
    const rec=u&&Store.get('users',[]).find(x=>x.u===u);
    if(rec){S.user={u:rec.u,l:rec.l};S.page='home'}
  }catch(e){}
  render();
})();
})();
